<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>Glory Gamers - Jeu</title>
  <script src="prefs.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">GLORY <span>GAMERS</span></a>
    <div class="header-actions"><div id="authArea"></div></div>
  </header>

  <main class="game-page" id="gameDetail"></main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">✕</button>
    <img id="lightboxImg" alt="Capture d'écran agrandie">
  </div>

  <footer class="footer">
    <a href="index.html" class="logo">GLORY <span>GAMERS</span></a>
    <p>© 2026 Glory Gamers. Tous droits réservés.</p>
  </footer>

  <script src="games.js"></script>
  <script type="module" src="auth.js"></script>
  <script src="game.js"></script>
  <script>
    // Si auth.js n'a pas pu se charger, on le dit au lieu de ne rien faire
    window.addEventListener("load", function () {
      if (window.Auth) return;
      var area = document.getElementById("authArea");
      if (!area) return;
      var b = document.createElement("button");
      b.className = "login-btn";
      b.textContent = "Connexion";
      b.onclick = function () {
        alert(location.protocol === "file:"
          ? "Ouvre le site via un serveur (http://localhost ou ton domaine), pas en double-cliquant sur le fichier."
          : "La connexion n'a pas pu se charger. Vérifie ta connexion internet et la console du navigateur (F12).");
      };
      area.appendChild(b);
    });
  </script>
  <script src="ads.js" defer></script>
</body>
</html>
